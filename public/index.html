<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 记忆中枢</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">AI Agent 记忆中枢</div>
  <div class="topbar-right">
    <span id="scan-time" class="scan-time"></span>
    <button id="btn-rescan" class="btn btn-ghost">重新扫描</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-section">
      <div class="side-title">全局记忆</div>
      <div id="global-list"></div>
    </div>
    <div class="side-section">
      <div class="side-title">项目</div>
      <div id="project-list"></div>
    </div>
  </aside>

  <main class="main">
    <div class="view-head">
      <h2 id="view-title">加载中…</h2>
      <input id="filter" class="filter" type="text" placeholder="筛选记忆标题 / 内容…">
    </div>
    <div id="dup-hint" class="dup-hint" hidden></div>
    <div id="entry-list" class="entry-list"></div>
  </main>

  <aside id="preview" class="preview" hidden>
    <div class="preview-head">
      <span id="preview-title"></span>
      <button id="preview-close" class="btn btn-ghost btn-sm">关闭</button>
    </div>
    <pre id="preview-body"></pre>
  </aside>
</div>

<footer class="actionbar">
  <label class="sel-count"><input type="checkbox" id="check-all"> 已选 <b id="sel-count">0</b> 条</label>
  <div id="merge-target-box" class="merge-target" hidden>
    <span>合并到项目：</span>
    <select id="merge-target"></select>
  </div>
  <div class="pointers">
    <label><input type="checkbox" id="ptr-claude" checked> 生成 CLAUDE.md</label>
    <label><input type="checkbox" id="ptr-qoder" checked> 生成 QODER.md</label>
    <label><input type="checkbox" id="ptr-trae" checked> 生成 Trae 规则</label>
  </div>
  <button id="btn-merge" class="btn btn-primary">合并并写入 AGENTS.md</button>
</footer>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
